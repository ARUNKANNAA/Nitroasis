name: Build & Release Android APK

on:
  push:
    branches: ["main"]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Nitroasis Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make Gradle Executable
        run: |
          sed -i 's/\r$//' android/gradlew
          chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          set -o pipefail
          ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee ../gradle_output.log

      - name: Report Build Diagnostics on Failure
        if: failure()
        run: |
          echo "### Gradle Build Log (Tail)" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          tail -n 100 gradle_output.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          python3 -c "
          with open('gradle_output.log') as f:
              for line in f.readlines()[-60:]:
                  clean = line.strip()
                  if any(k in clean for k in ['FAILURE', 'What went wrong', 'Caused by', 'error:', 'Exception', '> ']):
                      print(f'::error::{clean}')
          "

      - name: Prepare APK Output
        run: |
          mkdir -p build-output
          find android/ -name "*.apk" -exec cp {} build-output/Nitroasis-v1.0.0.apk \;
          ls -la build-output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nitroasis-v1.0.0-APK
          path: build-output/Nitroasis-v1.0.0.apk

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: "Nitroasis v1.0.0 — Android APK & Production Release"
          draft: false
          prerelease: false
          overwrite: true
          body: |
            ### 🌱 Nitroasis Android Mobile App (v1.0.0)

            Direct installable APK for Android devices. Features full embedded offline telemetry, on-device Edge Impulse TinyML crop classification, 3D CAD STL enclosure viewer, and local ESP32-S3 SoftAP connection.

            - **App Name:** Nitroasis
            - **Package:** `com.arunkannaa.nitroasis`
            - **Target Platform:** Android 7.0 (API 24) to Android 14 (API 34)
            - **Architecture:** Universal (ARMv7, ARM64, x86_64)
            - **Download:** Click `Nitroasis-v1.0.0.apk` below to download and install.
          files: build-output/Nitroasis-v1.0.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
