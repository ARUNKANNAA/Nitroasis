name: Build & Release Android APK

on:
  push:
    branches: ["main"]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Nitroasis Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Build Release APK
        run: |
          cd android
          ./gradlew assembleRelease --stacktrace

      - name: Rename and Prepare APK
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/release/app-release.apk build-output/Nitroasis-v1.0.0.apk || cp android/app/build/outputs/apk/debug/app-debug.apk build-output/Nitroasis-v1.0.0.apk
          ls -la build-output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nitroasis-v1.0.0-APK
          path: build-output/Nitroasis-v1.0.0.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: "Nitroasis v1.0.0 — Android APK & Production Release"
          body: |
            ### 🌱 Nitroasis Android Mobile App (v1.0.0)

            Direct installable APK for Android devices. Features full embedded offline telemetry, on-device Edge Impulse TinyML crop classification, 3D CAD STL enclosure viewer, and local ESP32-S3 SoftAP connection.

            - **App Name:** Nitroasis
            - **Package:** `com.arunkannaa.nitroasis`
            - **Target Android Version:** Android 7.0 (API 24) to Android 14 (API 34)
            - **Download:** Download `Nitroasis-v1.0.0.apk` below and install directly on your phone.
          files: build-output/Nitroasis-v1.0.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
